[project]
name = "nfl-raw-pipeline"
version = "0.1.0"
description = "Scrapes NFL Shield-API game JSON into a committed raw library (sibling of nfl-data, which owns modeling)."
requires-python = ">=3.9"
dependencies = [
    "sportsdataverse @ git+https://github.com/sportsdataverse/sportsdataverse-py@main",
    "polars>=1.0,<2.0",
]

# NOTE: sportsdataverse>=0.0.59 supplies the NFL Shield API wrappers the raw fetcher
# imports (sportsdataverse.nfl.nfl_api / nfl_games). It resolves from PyPI so a clean
# `uv sync` works without a sibling checkout. For local co-development against an
# unreleased sdv-py, run `uv pip install -e ../../sdv-py` after `uv sync` (do not add a
# path source to [tool.uv.sources] — it would break any environment lacking the sibling).

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# NOTE: modeling-only deps (xgboost, numpy) and the `figures` group (plotnine,
# scikit-misc) were dropped in the SP3 decommission — modeling now lives in nfl-data.

# requires-python is >=3.9, and this repo is never tested below the 3.12 CI pin,
# so the 3.9 promise has to be kept by rule rather than by exercise.
#
# keep-runtime-typing stops UP006/UP007 rewriting `Optional[X]` -> `X | None`.
# Ruff applies those whenever `from __future__ import annotations` is present,
# because the annotation is then only a string -- but a string is not the whole
# story: `typing.get_type_hints()` RESOLVES it, and `dict | None` raises TypeError
# on 3.9 when it does. Anything introspecting these signatures would break on the
# floor we advertise.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["python*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
